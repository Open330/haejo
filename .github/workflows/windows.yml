name: windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "haejo/windows_driver.py"
      - "haejo/uia_backend.py"
      - "haejo/windows_control.py"
      - "haejo/cli.py"
      - "haejo/flow_session.py"
      - "haejo/authoring.py"
      - "tests/test_windows_*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  uia:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.22"
      - name: Sync
        run: uv sync --frozen
      - name: Portable unit tests
        run: uv run python -B -m unittest tests.test_windows_driver tests.test_windows_cli tests.test_windows_session_input
      - name: Real UI Automation against owned app instances
        env:
          HAEJO_WINDOWS_LIVE: "1"
          HAEJO_WINDOWS_LIVE_REQUIRED: "1"
        run: uv run python -B -m unittest -v tests.test_windows_live
