<!doctype html>
<!-- Haejo showcase film, B tone ("해줘 트레일러"). One 1920x1080 stage; every
     frame is a pure function of t: renderAt(t) places plates and captions.
     Plates are real: Safari/TextEdit window captures from an agent's Haejo
     calls and from the saved Flows' replay, the Haejo activity window over
     that task's receipts, and Haejo's own landing recordings. render.py steps t. -->
<html lang="ko"><head><meta charset="utf-8"><title>Haejo film</title>
<style>
:root{--ink:#1c1b1a;--paper:#fffaf6;--orange:#e8590c;--term:#17181b;--line:rgba(28,27,26,.12);
--sans:"Apple SD Gothic Neo","Pretendard","Helvetica Neue",sans-serif;--mono:"SF Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:var(--sans);color:var(--ink);
background:radial-gradient(1200px 800px at 85% 10%,#ffe0c9 0,rgba(255,224,201,0) 70%),radial-gradient(900px 700px at 0% 100%,#ffd2b3 0,rgba(255,210,179,0) 70%),var(--paper)}
.layer{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.card{position:absolute;border-radius:22px;box-shadow:0 30px 80px rgba(60,30,10,.18),0 4px 14px rgba(60,30,10,.10)}
.term{background:var(--term);color:#ece8e1;font:25px/1.6 var(--mono);padding:30px 34px;overflow:hidden}
.term .ln{white-space:pre;opacity:0}.term .dim{color:#8d8a85}.term .ok{color:#7ee2a0}.term .acc{color:#ffb27a}.term .me{color:#ffffff}
.term .caret{display:inline-block;width:14px;height:28px;background:#ece8e1;vertical-align:-5px;margin-left:4px}
.plate{position:absolute;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(60,30,10,.24),0 2px 8px rgba(60,30,10,.12)}
.plate img{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0}
.hl{position:absolute;border:5px solid var(--orange);border-radius:14px;opacity:0;z-index:2}
.chip{position:absolute;font:700 28px var(--sans);padding:12px 22px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(60,30,10,.14);display:flex;gap:12px;align-items:center;opacity:0;white-space:nowrap}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--orange)}.chip.ok i{background:#2f9e44}
.sticker{position:absolute;left:110px;top:84px;background:var(--orange);color:#fff;font:800 62px/1 var(--sans);padding:20px 34px 22px;border-radius:18px;
letter-spacing:-.02em;box-shadow:0 14px 30px rgba(232,89,12,.35);transform-origin:0 50%;white-space:nowrap;z-index:5}
.title{position:absolute;left:150px;top:340px;font:800 124px/1.14 var(--sans);letter-spacing:-.045em}
.title span{display:inline-block;opacity:0;margin-right:.24em}.title .em{color:var(--orange)}
.win{position:absolute;left:240px;top:200px;width:1440px;height:951px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 30px 90px rgba(60,30,10,.25)}
.win img{position:absolute;left:0;top:0;width:100%;transform-origin:75% 18%}
.lane{position:absolute;left:110px;right:110px;height:250px}
.lane .app{position:absolute;left:0;top:-52px;font:800 30px var(--sans);display:flex;gap:12px;align-items:center}
.lane .app small{font:600 24px var(--mono);color:#8a837b}
.node{position:absolute;top:0;width:420px;height:200px;background:#fff;border-radius:22px;border:2px solid var(--line);padding:24px 26px;opacity:0;box-shadow:0 18px 40px rgba(60,30,10,.10)}
.node .k{font:700 22px var(--mono);color:#9a948c}.node .n{font:800 36px/1.2 var(--sans);margin-top:10px;letter-spacing:-.02em}
.node .v{position:absolute;left:26px;bottom:20px;font:700 28px var(--mono);color:var(--orange)}
.node.lit{border-color:var(--orange);box-shadow:0 0 0 6px rgba(232,89,12,.18),0 18px 40px rgba(60,30,10,.12)}
.edge{position:absolute;height:5px;background:#e6ddd4;border-radius:3px;transform-origin:0 50%}
.vedge{position:absolute;width:5px;background:#e6ddd4;border-radius:3px;transform-origin:50% 0}
.flowhead{position:absolute;left:110px;top:210px;font:800 52px var(--sans);letter-spacing:-.03em}
.flowhead small{display:block;font:600 28px var(--mono);color:#8a837b;margin-top:12px;letter-spacing:0}
.big0{position:absolute;font:800 280px/1 var(--mono);letter-spacing:-.06em}
.big0 small{display:block;font:700 38px var(--sans);letter-spacing:0;color:#7c746b;margin-top:6px}
.stat{position:absolute;font:700 34px var(--sans);color:#5c554e}.stat b{color:var(--orange);font-family:var(--mono)}
.web{position:absolute;left:300px;top:225px;width:1320px;height:825px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(60,30,10,.22)}
.web video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;opacity:0}
.webtag{position:absolute;right:28px;bottom:26px;background:rgba(28,27,26,.85);color:#fff;font:700 30px var(--sans);padding:10px 20px;border-radius:12px;z-index:2}
.end{display:grid;place-items:center;text-align:center}
.end .logo{height:170px;display:block;margin:0 auto}
.end .tag{font:800 62px/1.25 var(--sans);letter-spacing:-.03em;margin-top:56px}
.end .chips{display:flex;gap:16px;justify-content:center;margin-top:40px}
.end .chips span{font:700 30px var(--sans);padding:12px 24px;border-radius:999px;border:2px solid var(--line);background:#fff}
.end .url{font:700 34px var(--mono);color:var(--orange);margin-top:30px}
</style></head><body>
<div id="stage">
  <div class="layer" id="L-title"><div class="title" id="title"></div></div>

  <div class="layer" id="L-ask">
    <div class="card term" id="ask-term" style="left:70px;top:230px;width:720px;height:540px;font-size:22px"><div id="ask-lines"></div></div>
    <div class="plate" id="ask-safari" style="left:820px;top:120px;width:1040px;height:681px"><div class="hl" id="ask-hl"></div></div>
    <div class="plate" id="ask-te" style="left:560px;top:650px;width:1200px;height:394px"></div>
    <div class="chip ok" id="ask-saved" style="left:1480px;top:604px"><i></i><span data-t="saved"></span></div>
  </div>

  <div class="layer" id="L-log"><div class="win"><img id="log-img" alt=""></div></div>

  <div class="layer" id="L-flow">
    <div class="flowhead"><span data-t="flow_head"></span><small>haejo replay weekly-bugs · weekly-memo</small></div>
    <div class="lane" id="lane-a" style="top:470px"><div class="app">Safari <small>weekly-bugs</small></div></div>
    <div class="lane" id="lane-b" style="top:790px"><div class="app">TextEdit <small>weekly-memo</small></div></div>
  </div>

  <div class="layer" id="L-replay">
    <div class="card term" id="rep-term" style="left:90px;top:220px;width:1000px;height:330px;font-size:24px"><div id="rep-lines"></div></div>
    <div class="big0" id="big0" style="left:120px;top:600px">0<small data-t="model_calls"></small></div>
    <div class="stat" id="rep-stat" style="left:560px;top:820px"></div>
    <div class="plate" id="rep-safari" style="left:1150px;top:150px;width:700px;height:458px"></div>
    <div class="plate" id="rep-te" style="left:1000px;top:560px;width:850px;height:279px"></div>
  </div>

  <div class="layer" id="L-web"><div class="web" id="web"><div class="webtag" id="webtag"></div></div></div>

  <div class="layer end" id="L-end"><div>
    <img class="logo" id="logo" alt="Haejo">
    <div class="tag" data-t="end_tag"></div>
    <div class="chips"><span data-t="chip_mac"></span><span>Claude Code</span><span>Codex</span></div>
    <div class="url" id="end-url"></div>
  </div></div>

  <div class="sticker" id="sticker"></div>
</div>
<script>
const Q=new URLSearchParams(location.search);const LANG=Q.get('lang')||'ko';
const PLATES=Q.get('plates')||'plates';const ASSETS=Q.get('assets')||'../dist/assets';
const FACTS=JSON.parse(Q.get('facts')||'{}');const END_URL=Q.get('url')||'';
const replaySeconds=(FACTS.replay_seconds||3).toFixed(1);
const TEXT={ko:{
 title:[['말하면',''],['\n',''],['바로','em'],['해 줍니다.','']],
 ask:'바로 해줘.', log:'한 일은 전부 기록', flow:'Flow로 저장', replay:'다음 주엔 다시', web:'Mac 앱도, 웹도',
 prompt:'vscode에서 댓글 많은 열린 버그 5개를\n  찾아서 회의 메모로 정리해줘',
 ask_lines:[['acc','● 버그 목록 열기'],['dim','  haejo open-url github.com/microsoft/vscode/…'],['acc','● 상위 5건 읽기'],['dim','  haejo run read-top5'],['acc','● 회의 메모에 정리하고 저장'],['dim','  haejo run memo · textedit_save'],['ok','✓ 저장됨 · 파일 내용 확인']],
 saved:'저장됨 · 11월 10일',
 flow_head:'이번에 한 일을 그대로 저장',
 lanes:[[['01','새로고침','같은 필터 페이지'],['02','상위 5건 읽기','bug1 … bug5']],[['03','회의 메모 작성','{{date}} · {{bug1..5}}'],['04','저장','파일 내용 확인']]],
 rep:[['me','$ haejo replay weekly-bugs'],['ok','done — 5건 읽음'],['me',"$ haejo replay weekly-memo -p date='11월 17일' …"],['ok','done'],['me','$ haejo replay textedit_save …'],['ok','done — 저장 확인']],
 model_calls:'모델 호출', rep_stat:s=>`재생 <b>${s}초</b> · 앱 2개`,
 end_tag:'Claude·Codex에게 Mac 앱을 맡기세요.', chip_mac:'macOS 앱 · 웹',
 webtags:['Finder · 정렬','Wikipedia · 문서 이동','Markdown 편집']},
en:{
 title:[['Just',''],['ask.',''],['\n',''],['It does','em'],['the work.','']],
 ask:'Just ask.', log:'Every call, on the record.', flow:'Saved as Flows.', replay:'Next week: replay.', web:'Mac apps. The web.',
 prompt:'Find the 5 most-discussed open bugs in\n  vscode and put them in a meeting note',
 ask_lines:[['acc','● Open the bug list'],['dim','  haejo open-url github.com/microsoft/vscode/…'],['acc','● Read the top 5'],['dim','  haejo run read-top5'],['acc','● Write and save the meeting note'],['dim','  haejo run memo · textedit_save'],['ok','✓ Saved · file contents verified']],
 saved:'Saved · Nov 10',
 flow_head:'What it just did, saved as is',
 lanes:[[['01','Reload','same filtered page'],['02','Read the top 5','bug1 … bug5']],[['03','Write the note','{{date}} · {{bug1..5}}'],['04','Save','file contents verified']]],
 rep:[['me','$ haejo replay weekly-bugs'],['ok','done — 5 bugs read'],['me',"$ haejo replay weekly-memo -p date='Nov 17' …"],['ok','done'],['me','$ haejo replay textedit_save …'],['ok','done — save verified']],
 model_calls:'model calls', rep_stat:s=>`replay <b>${s}s</b> · 2 apps`,
 end_tag:'Ask Haejo to use your apps.', chip_mac:'macOS apps · Web',
 webtags:['Finder · sort','Wikipedia · page link','Markdown editor']}}[LANG];
document.documentElement.lang=LANG;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=TEXT[e.dataset.t]);
document.getElementById('end-url').textContent=END_URL;

// Timeline (s). Scenes overlap by X for the 0.28 s punch-in.
const X=.28,S={title:[0,2.6],ask:[2.6,13.4],log:[13.4,18.8],flow:[18.8,24.6],replay:[24.6,32.4],web:[32.4,36.0],end:[36.0,40]};
const DURATION=40;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const spring=p=>{p=clamp(p);return 1-Math.cos(p*Math.PI*2.2)*Math.exp(-6*p)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function sceneEnv(t,[a,b]){const i=seg(t,a-X/2,a+X/2),o=1-seg(t,b-X/2,b+X/2);return {o:Math.min(i,o),s:1+.06*(1-ease(i))-.03*(1-ease(o)),on:t>=a-X/2&&t<b+X/2}}
const $=id=>document.getElementById(id);
const title=$('title');TEXT.title.forEach(([w,c])=>{if(w==='\n'){title.appendChild(document.createElement('br'));return}const s=document.createElement('span');s.textContent=w;if(c)s.className=c;title.appendChild(s)});
function rows(el,list){return list.map(([c,txt])=>{const d=document.createElement('div');d.className='ln '+c;d.textContent=txt;el.appendChild(d);return d})}
const promptLine=document.createElement('div');promptLine.className='ln me';promptLine.style.opacity=1;$('ask-lines').appendChild(promptLine);
const askRows=rows($('ask-lines'),TEXT.ask_lines);const repRows=rows($('rep-lines'),TEXT.rep);
function imgs(id,names){const box=$(id);return names.map(n=>{const im=new Image();im.src=`${PLATES}/${n}.png`;box.appendChild(im);return im})}
const askSafari=imgs('ask-safari',['safari-1']),askTe=imgs('ask-te',['textedit-0','textedit-3','textedit-4']);
const repSafari=imgs('rep-safari',['safari-r1']),repTe=imgs('rep-te',['textedit-r0','textedit-r2','textedit-r3']);
const show=(list,k)=>list.forEach((im,i)=>im.style.opacity=i===k?1:0);
const nodes=[];[['lane-a',0],['lane-b',1]].forEach(([id,li])=>{TEXT.lanes[li].forEach(([k,n,v],i)=>{const d=document.createElement('div');d.className='node';d.style.left=(li*520+i*560)+'px';
  d.innerHTML=`<div class="k">${k}</div><div class="n">${n}</div><div class="v">${v}</div>`;$(id).appendChild(d);nodes.push(d)});
  const e=document.createElement('div');e.className='edge';e.style.left=(li*520+420)+'px';e.style.top='98px';e.style.width='140px';$(id).appendChild(e);nodes[nodes.length-1].edge=e});
const vedge=document.createElement('div');vedge.className='vedge';Object.assign(vedge.style,{left:(110+560+210)+'px',top:(470+200)+'px',height:'120px'});$('L-flow').appendChild(vedge);
const webClips=[['native-finder',8],['browser-wikipedia',9],['browser-markdown',3]].map(([n,start])=>{const v=document.createElement('video');v.src=`${ASSETS}/demos/${n}.mp4`;v.muted=true;v.preload='auto';$('web').insertBefore(v,$('webtag'));return {v,start}});
$('log-img').src=`${PLATES}/activity.png`;$('logo').src=`${ASSETS}/haejo-wordmark.svg`;
function seek(v,time){return new Promise(r=>{if(Math.abs(v.currentTime-time)<1/120){r();return}v.addEventListener('seeked',()=>r(),{once:true});v.currentTime=time})}
window.ready=Promise.all([...[...document.images].map(im=>im.decode().catch(()=>{})),...webClips.map(({v})=>new Promise(r=>{if(v.readyState>=2)r();else v.addEventListener('loadeddata',r,{once:true})}))]);
const pop=(el,t,a,dur=.4)=>{const p=seg(t,a,a+dur);el.style.opacity=clamp(p*2.5);el.style.transform=`translateY(${(1-spring(p))*50}px) scale(${.96+.04*spring(p)})`;return p};

window.renderAt=async function(t){
  const pending=[];
  const layer=(id,win)=>{const e=sceneEnv(t,win),el=$(id);el.style.opacity=e.o;el.style.transform=`scale(${e.s})`;el.style.visibility=e.on?'visible':'hidden';return e};
  const key=['ask','log','flow','replay','web'].find(k=>t>=S[k][0]&&t<S[k][1]);const st=$('sticker');
  if(key){const p=seg(t,S[key][0]+.05,S[key][0]+.55);st.textContent=TEXT[key];st.style.opacity=clamp(p*3)*(1-seg(t,S[key][1]-.15,S[key][1]));st.style.transform=`rotate(-2.5deg) scale(${.6+.4*spring(p)})`}else st.style.opacity=0;

  layer('L-title',S.title);
  [...title.querySelectorAll('span')].forEach((s,i)=>{const p=seg(t,.15+i*.18,.55+i*.18);s.style.opacity=clamp(p*2.5);s.style.transform=`translateY(${(1-spring(p))*60}px)`});

  // Just ask: the agent's request, its Haejo calls, the real Safari and TextEdit windows.
  layer('L-ask',S.ask);
  const full=TEXT.prompt,typed=Math.floor(full.length*seg(t,2.8,4.6));
  promptLine.textContent='> '+full.slice(0,typed);if(t<4.9&&Math.floor(t*2.5)%2===0)promptLine.insertAdjacentHTML('beforeend','<span class="caret"></span>');
  [5.0,5.2,7.0,7.2,9.4,9.6,12.0].forEach((at,i)=>{const p=seg(t,at,at+.22);askRows[i].style.opacity=p;askRows[i].style.transform=`translateX(${(1-ease(p))*20}px)`});
  pop($('ask-safari'),t,5.3,.45);show(askSafari,0);
  const hl=$('ask-hl');Object.assign(hl.style,{left:'262px',top:'361px',width:'758px',height:'314px'});hl.style.opacity=t>7.2&&t<9.8?1:0;
  pop($('ask-te'),t,9.7,.45);show(askTe,t<10.4?0:t<12.0?1:2);
  pop($('ask-saved'),t,12.1,.35);

  // Activity: the Haejo window over this task's receipts.
  layer('L-log',S.log);
  const lp=ease(seg(t,13.7,18.4));$('log-img').style.transform=`scale(${1+.12*lp})`;

  // Saved as Flows: two lanes, a data edge from the read step to the note.
  layer('L-flow',S.flow);
  nodes.forEach((n,i)=>{pop(n,t,19.2+i*.55,.4);n.classList.toggle('lit',t>22.6);
    if(n.edge){const q=seg(t,19.5+i*.55,19.9+i*.55);n.edge.style.transform=`scaleX(${q})`;n.edge.style.background=t>22.6?'var(--orange)':'#e6ddd4'}});
  const vq=seg(t,20.4,20.9);vedge.style.transform=`scaleY(${vq})`;vedge.style.background=t>22.6?'var(--orange)':'#e6ddd4';

  // Replay next week: real commands, real windows, zero model calls.
  layer('L-replay',S.replay);
  [24.9,26.1,26.5,27.4,27.8,28.6].forEach((at,i)=>{repRows[i].style.opacity=seg(t,at,at+.18)});
  pop($('rep-safari'),t,25.2,.4);show(repSafari,0);pop($('rep-te'),t,26.4,.4);show(repTe,t<27.4?0:t<28.6?1:2);
  const z=seg(t,29.0,29.5);$('big0').style.opacity=z;$('big0').style.transform=`scale(${.7+.3*spring(z)})`;$('big0').style.transformOrigin='0 60%';
  $('rep-stat').innerHTML=TEXT.rep_stat(replaySeconds);$('rep-stat').style.opacity=seg(t,29.7,30.0);

  const ew=layer('L-web',S.web);const slot=Math.min(2,Math.floor((t-S.web[0])/1.2));
  webClips.forEach((c,i)=>{const on=ew.on&&i===slot;c.v.style.opacity=on?1:0;
    if(on){const local=t-S.web[0]-i*1.2;pending.push(seek(c.v,c.start+local*1.2));c.v.style.transform=`scale(${1.04-.04*ease(clamp(local/.35))})`}});
  $('webtag').textContent=TEXT.webtags[Math.max(0,slot)];

  layer('L-end',S.end);
  await Promise.all(pending);
};
</script></body></html>
